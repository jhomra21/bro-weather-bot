name: Apply and validate clean section headings

on:
  push:
    branches:
      - fix/clean-section-headings

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clean-section-headings
      - uses: oven-sh/setup-bun@v2
      - name: Apply source patch
        run: python3 .tmp-clean-section-headings.py
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet -- lib/renderHtmlEmail.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/renderHtmlEmail.ts
            git commit -m 'fix: clean weather section headings'
            git push origin HEAD:fix/clean-section-headings
          fi
      - name: Validate renderer
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run generate-types
          bunx tsc
          bun .tmp-validate-clean-section-headings.ts
          git diff --check
