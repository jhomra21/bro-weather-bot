name: Apply and validate divider dedupe

on:
  push:
    branches:
      - fix/dedupe-weather-section-divider

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedupe-weather-section-divider
      - uses: oven-sh/setup-bun@v2
      - name: Apply source patch
        run: python3 .tmp-apply-divider-dedupe.py
      - name: Commit source patch
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet -- lib/renderHtmlEmail.ts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/renderHtmlEmail.ts
            git commit -m 'fix: dedupe structured weather divider'
            git push origin HEAD:fix/dedupe-weather-section-divider
          fi
      - name: Validate renderer
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run generate-types
          bunx tsc
          bun .tmp-validate-divider-dedupe.ts
          git diff --check
