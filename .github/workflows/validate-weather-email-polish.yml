name: Validate weather email polish

on:
  push:
    branches:
      - fix/email-forecast-mobile-polish

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run generate-types && bunx tsc
      - name: Verify mobile weather hierarchy
        shell: bash
        run: |
          cat > validate-weather-email.ts <<'TS'
          import { renderHtmlEmail } from "./lib/renderHtmlEmail.ts";

          const sample = `
          FXUS64 KBRO 311135 AAB
          AFDBRO
          Area Forecast Discussion...UPDATED
          National Weather Service Brownsville TX
          635 AM CDT Mon Aug 31 2026

          .CLIMATE...
          Issued at 1036 PM CDT Sun Aug 30 2026

          Record High Temperatures from August 31st to September 4th:

          Monday, August 31, 2026
          Brownsville: 103F (2023)
          Harlingen: 104F (1958)
          McAllen: 104F (2023, 2017)

          Tuesday, September 1, 2026
          Brownsville: 100F (2023, 2020)
          Harlingen: 103F (1928, 1952)
          McAllen: 106F (2018)

          .PRELIMINARY POINT TEMPS/POPS...
          BROWNSVILLE 98 80 98 80 / 0 0 0 0
          HARLINGEN 102 76 102 76 / 0 0 0 0
          MCALLEN 104 80 104 81 / 0 0 0 0

          .BRO WATCHES/WARNINGS/ADVISORIES...
          TX...None.
          `;

          const html = renderHtmlEmail(sample);
          const required = [
            "Record highs",
            "Daily record high temperatures · °F",
            ">104°</td>",
            "Point forecast",
            "Daily low–high range and precipitation chance",
            "Brownsville",
            "Rain 0%",
            "5° below the record high",
            "Ties the record high",
            "Previously reached in 2023 and 2017",
            "border-radius:999px",
            "x-apple-data-detectors=\"false\"",
            "a[x-apple-data-detectors]",
          ];
          for (const value of required) {
            if (!html.includes(value)) throw new Error(`Missing expected output: ${value}`);
          }

          const forbidden = [
            "104F (2023, 2017)</td>",
            "Record 103F",
            "colspan=\"4\">Temps",
            ".PRELIMINARY POINT TEMPS/POPS...",
            "min-width:760px",
          ];
          for (const value of forbidden) {
            if (html.includes(value)) throw new Error(`Unexpected legacy output: ${value}`);
          }

          if (!html.includes('white-space:nowrap;\">5° below the record high</div>')) {
            throw new Error("Record comparison is not protected from awkward wrapping");
          }

          console.log("weather email hierarchy: PASS");
          TS
          bun validate-weather-email.ts
      - run: git diff --check
